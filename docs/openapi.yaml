openapi: 3.0.3
info:
  title: Vitail connected MVP API
  version: '2026-09-25'
  description: >-
    Implemented routes only. JWT authentication is required except register,
    login and refresh. Owner/café roles come from the authenticated account.
    Auth and dog paths use no trailing slash; wallet, redemption, café and walk
    paths also accept a trailing slash, as do quest and document
    paths. Arrays are currently unpaginated.
    Venue IDs are separate from legacy café account IDs; existing cafe_id fields
    retain their account-ID meaning. New location/social foundation tables do
    not expose HTTP routes here. Django Admin is a separate session/CSRF-protected
    interface, not this API.
servers:
  - url: http://127.0.0.1:8000
    description: Local development; replace with the shared HTTPS backend for devices.
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      summary: Register an OWNER account (client roles are ignored)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoginRequest'
                - type: object
                  required: [display_name]
                  properties:
                    display_name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201':
          description: Owner and tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '400': {$ref: '#/components/responses/Error'}
  /api/auth/login:
    post:
      summary: Sign in with email/password for either role
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: User and tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/auth/refresh:
    post:
      summary: Obtain a new access token with a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: {type: string}
      responses:
        '200':
          description: Access token (refresh-token rotation is not enabled)
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/auth/me:
    get:
      summary: Read the authenticated profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      summary: Update display name only; email and role are not editable here
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/dogs:
    get:
      summary: List the OWNER's dogs
      responses:
        '200':
          description: Owned dogs, oldest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Dog'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Add an owned dog (maximum 10 per account)
      description: >-
        Supply a non-null date_of_birth, or age_months for a legacy client.
        A supplied birthday determines the returned age in completed calendar
        months; a conflicting age_months is ignored. An age-only request leaves
        the birthday unknown and does not invent a birth date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DogInput'
                - required: [name, breed_id, size]
                  anyOf:
                    - required: [age_months]
                    - required: [date_of_birth]
                      properties:
                        date_of_birth: {type: string, format: date, nullable: false}
      responses:
        '201':
          description: Created dog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dog'}
        default: {$ref: '#/components/responses/Error'}
  /api/dogs/breeds:
    get:
      summary: List breed reference data (OWNER only)
      responses:
        '200':
          description: Breeds ordered by name
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Breed'}}
        default: {$ref: '#/components/responses/Error'}
  /api/dogs/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      summary: Update a dog owned by the authenticated OWNER
      description: >-
        Omitted birthdays remain unchanged. A known birthday is authoritative
        even when a legacy client sends age_months alone. Explicitly setting
        date_of_birth to null clears it and preserves the last computed age
        unless age_months is supplied. Future birthdays are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DogInput'}
      responses:
        '200':
          description: Updated dog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dog'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete an owned dog
      responses:
        '204': {description: Deleted; no response body}
        default: {$ref: '#/components/responses/Error'}
  /api/walks:
    get:
      summary: List owned walk summaries, newest end time first (OWNER only)
      responses:
        '200':
          description: Walk history; raw GPS samples are not persisted or returned
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Walk'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Validate one manual walk and credit distance points once (OWNER only)
      description: >-
        Submit within 12 hours of starting; duration is at most 12 hours and
        future timestamps have at most 30 seconds of clock skew. All dogs must
        belong to the owner and submitted walks cannot overlap. Samples must be
        strictly time-ordered and inside the start/end interval. Require two
        readings accurate to 30 m. Simulated samples are rejected; poor accuracy,
        gaps over 60 seconds and segments above 3 m/s earn no distance.
        Five minutes of inactivity ends credit. Distance awards use the current
        daily cumulative floor policy (8 points/km, maximum 40 walking points),
        pending confirmation of decision O7. Awards also respect the shared
        72-point walking/check-in cap. Day is the Melbourne local end date.
        No goal/check-in/streak points are awarded by this endpoint; uploaded
        walks with validated movement can qualify a streak day, whose milestone
        reward is collected separately from Quest. Samples do not populate the
        live-location foundation tables. Repeating the
        same UUID and payload returns the original result without a second award.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, started_at, ended_at, dog_ids, samples]
              properties:
                request_id: {type: string, format: uuid}
                started_at: {type: string, format: date-time}
                ended_at: {type: string, format: date-time}
                dog_ids: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: integer, minimum: 1}}
                samples: {type: array, minItems: 2, maxItems: 5000, items: {$ref: '#/components/schemas/WalkSample'}}
      responses:
        '201':
          description: Created walk, or original walk for an identical retry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Walk'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: IDEMPOTENCY_CONFLICT; UUID was reused with a different walk payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/wallet:
    get:
      summary: Read the OWNER's unexpired point balance
      description: Applies due order refunds and point expiry before returning the balance.
      responses:
        '200':
          description: Authoritative balance
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /api/wallet/ledger:
    get:
      summary: Read the OWNER's immutable point history
      responses:
        '200':
          description: Credits and debits ordered by creation time and ID
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PointEntry'}}
        default: {$ref: '#/components/responses/Error'}
  /api/redemptions/rewards:
    get:
      summary: Browse available rewards from active CAFE accounts (OWNER only)
      description: >-
        Includes available products at active partner Venues with active café
        managers, an open sale window and remaining Melbourne-day allocation.
        venue_id identifies the place; cafe_id retains the legacy User ID.
        Product, venue and account photos are separate assets.
      responses:
        '200':
          description: Reward catalogue
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Reward'}}
        default: {$ref: '#/components/responses/Error'}
  /api/redemptions:
    get:
      summary: Read the OWNER's pending and terminal redemption history
      description: Applies due order refunds; history is newest first.
      responses:
        '200':
          description: Owned redemptions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Redemption'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Order one reward, quantity 1, with an immediate atomic point deduction
      description: >-
        OWNER only. Price, owner, venue, café and terms are determined by the
        server. Sale windows and the per-product Melbourne-day quantity limit
        are checked under the product lock. Pending unexpired and collected
        orders consume allocation; cancelled/expired orders release it.
        Send a request_id UUID and reuse it when retrying the same confirmation.
        The same owner/UUID/reward returns the original order even if that offer
        is later disabled. A different reward with the same UUID is a conflict.
        Omitting request_id is supported for older clients but is not retry-safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
                reward_id: {type: integer, minimum: 1}
                request_id: {type: string, format: uuid}
      responses:
        '201':
          description: Created redemption, or original redemption for an identical retry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Redemption'}
        '400':
          description: Invalid request, INSUFFICIENT_POINTS or REWARD_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/redemptions/{id}/collect:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Collect an owned pending order; no location gate
      description: >-
        OWNER only. Already-collected orders return their existing result.
        An expired pending order is refunded and committed before returning 409.
        Other owners' IDs return 404; café accounts cannot collect orders.
      responses:
        '200':
          description: Collected redemption
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Redemption'}
        '404': {description: No such redemption owned by this user}
        '409':
          description: REDEMPTION_NOT_COLLECTIBLE (expired or cancelled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/cafe/products:
    get:
      summary: List all products belonging to the signed-in CAFE
      description: Includes available and unavailable products. Other cafés' products are never returned.
      responses:
        '200':
          description: Own menu, ordered by point cost, name and ID; an empty menu returns an empty array
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CafeProduct'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create a product for the signed-in CAFE
      description: >-
        CAFE only. The server assigns the café; IDs, ownership fields and unknown
        properties are rejected. Products belong to the managed Venue. Listing
        requires an available product, active partner venue and active café
        manager, an open sale window and remaining daily allocation. Photos are
        read-only on this endpoint; terms and requires_store_purchase describe
        the offer and do not create a fiat payment or purchase-verification flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CafeProductInput'
                - required: [name, point_cost]
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CafeProduct'}
        default: {$ref: '#/components/responses/Error'}
  /api/cafe/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      summary: Edit an owned product or change its availability (CAFE only)
      description: >-
        Partial updates are accepted. Other cafés' IDs and missing IDs return
        404. IDs, ownership fields and unknown properties are rejected. Changes
        are atomic with concurrent order creation. Setting is_available to false
        removes the product from the owner catalogue and blocks new orders;
        existing orders retain their original name, price, café and terms
        snapshots and can still be collected. A non-null ends_at must be after
        starts_at. Products are unlisted instead of deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CafeProductInput'}
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CafeProduct'}
        '404': {description: No such product owned by this café}
        default: {$ref: '#/components/responses/Error'}
  /api/cafe/orders:
    get:
      summary: Read-only pending order feed for the signed-in CAFE
      description: >-
        Uses the same canonical redemptions owners created, scoped to their
        order-time café. No since parameter returns a reset snapshot. A cursor
        returns changed upserts/removals; unchanged returns 304 with no body.
        Due orders expire/refund before polling. Empty catalogues return an
        empty feed. Cafés cannot modify orders through this endpoint.
        owner_dog_names and owner_dogs contain current customer-profile dogs, not dogs tied to
        this order or a walk. Clients displaying those names should request
        include_owner_dogs=true: every poll then returns a reset snapshot so
        profile name/photo edits are visible even when the order cursor has not changed.
      parameters:
        - name: since
          in: query
          description: One non-negative integer cursor from this café/backend, not a timestamp
          schema: {type: integer, format: int64, minimum: 0}
        - name: include_owner_dogs
          in: query
          description: true requests a complete pending-order snapshot with fresh profile dog names; false or omitted preserves order-only delta/304 behavior
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Snapshot or delta
          headers:
            X-Cafe-Orders-Cursor: {schema: {type: string}, description: Cursor also present in the body}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [cursor, upserts, removed_ids, reset]
                properties:
                  cursor: {type: integer, format: int64, minimum: 0}
                  upserts: {type: array, items: {$ref: '#/components/schemas/CafeOrder'}}
                  removed_ids: {type: array, items: {type: integer}}
                  reset: {type: boolean}
        '304':
          description: Unchanged; no response body
          headers:
            X-Cafe-Orders-Cursor: {schema: {type: string}}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
        '400':
          description: INVALID_CURSOR (malformed, duplicate or ahead of the server)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/cafe/profile:
    get:
      summary: Read the signed-in CAFE's venue profile
      description: Returns the normalized Venue managed by this café account; venue_id is the place ID, distinct from the login account ID.
      responses:
        '200':
          description: Own venue details; name and photo are separate from the login account profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CafeProfile'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      summary: Update own venue name, address, description, hours and Maps link
      description: >-
        CAFE only. Partial updates are accepted. Email, role, user IDs,
        venue identity, offers and point prices cannot be changed here. Name
        updates the managed Venue, not User.display_name. Existing order name,
        price, café and terms snapshots do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                address: {type: string, maxLength: 255}
                description: {type: string, maxLength: 2000}
                opening_hours: {type: string, maxLength: 500}
                google_maps_url: {type: string, maxLength: 2048, description: Google Maps http(s) link; blank uses the café name and address search}
      responses:
        '200':
          description: Updated own café profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CafeProfile'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/me/photo:
    post:
      summary: Upload the authenticated user avatar
      description: >-
        Upload raw base64 JPEG, PNG or WebP, at most 4 MiB decoded and 16 megapixels.
        The server applies orientation, resizes to at most 1024 pixels per side,
        removes metadata and stores a generated JPEG filename. Replaces the prior
        uploaded avatar. Responses include an absolute photo URL; no arbitrary
        filesystem names or URLs are accepted for upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoUpload'}
      responses:
        '200':
          description: Saved avatar
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /api/dogs/{id}/photo:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Upload an owned dog avatar (OWNER only)
      description: >-
        Upload raw base64 JPEG, PNG or WebP, at most 4 MiB decoded and 16 megapixels.
        The server applies orientation, resizes to at most 1024 pixels per side,
        removes metadata and stores a generated JPEG filename. Replaces the prior
        uploaded avatar. Responses include an absolute photo URL; no arbitrary
        filesystem names or URLs are accepted for upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoUpload'}
      responses:
        '200':
          description: Saved avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        default: {$ref: '#/components/responses/Error'}
  /api/cafe/profile/photo:
    post:
      summary: Upload own venue avatar (CAFE only)
      description: >-
        Upload raw base64 JPEG, PNG or WebP, at most 4 MiB decoded and 16 megapixels.
        The server applies orientation, resizes to at most 1024 pixels per side,
        removes metadata and stores a generated JPEG filename. Replaces the prior
        uploaded Venue photo without changing the login account avatar.
        Responses include an absolute photo URL; no arbitrary
        filesystem names or URLs are accepted for upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoUpload'}
      responses:
        '200':
          description: Saved avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CafeProfile'
        default: {$ref: '#/components/responses/Error'}
  /api/quests:
    get:
      summary: Read the OWNER's actionable Quest tasks
      description: >-
        Returns server_time, timezone, local_date, next_reset_at and tasks using
        the Australia/Melbourne calendar, including daylight-saving changes.
        Tasks are ordered READY, IN_PROGRESS, then COLLECTED with stable IDs.
        Only eligible document tasks, pending entitlements, today's available
        birthdays, one streak progress task and the owner's rewards collected today appear. Previous-day
        collected rows disappear while their history remains stored. Disabled
        capabilities omit their rows; unknown kinds/states and null progress
        must never enable collection or imply zero-percent completion.
        STREAK uses validated walking days and exposes the oldest earned uncollected
        milestone, otherwise the current run's next target. Earned claims survive
        a broken run. There are no separate collected streak rows.
        No base walking row, unimplemented goal award or check-in provider
        is fabricated. Empty tasks is valid. Legacy dashboard section projections
        are removed; evidence/history use the documents endpoint. Read requests
        never create a credit.
      responses:
        '200':
          description: Current owner-scoped quest state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestDashboard'}
        default: {$ref: '#/components/responses/Error'}
  /api/quests/birthdays/{dog_id}/collect:
    parameters:
      - name: dog_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    post:
      summary: Collect 60 birthday points once per dog per calendar year (OWNER only)
      description: >-
        The server verifies the dog's birthday against today's Melbourne date
        and credits the wallet atomically. No request UUID is needed: the dog
        and year identify the entitlement, including after an ownership transfer.
        A 29 February birthday is eligible only on an actual 29 February.
        The original recipient may retry an award from the current year after
        a profile correction, transfer, deletion or quest disable; the existing
        award and current wallet balance are returned without another credit.
        A new owner cannot collect a birthday reward already used for that dog
        in the same year and never receives the original recipient's balance.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, description: Empty object; the server determines eligibility and points}
      responses:
        '201':
          description: New birthday award; created is true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BirthdayCollection'}
        '200':
          description: Existing award for the original recipient; created is false
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BirthdayCollection'}
        '400':
          description: BIRTHDAY_REQUIRED or BIRTHDAY_IN_FUTURE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: DOG_NOT_FOUND; no owned dog or replayable award
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: BIRTHDAY_NOT_TODAY, BIRTHDAY_ALREADY_CLAIMED or QUEST_DISABLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/quests/streaks/collect:
    post:
      summary: Collect one walking streak milestone (OWNER only)
      description: >-
        The server verifies consecutive Melbourne dates from persisted validated
        walks with actual movement. Same-day walks count once, including valid
        walks earning zero points due to rounding or the daily cap. A missed
        day breaks the run; each run earns 20 points at seven days and 100 points
        at each 30-day milestone. Earned claims remain collectible after a break.
        New collections must match the displayed oldest unclaimed milestone.
        The owner, run start and milestone identify the reward, so no request
        UUID is required. Collection locks the owner and creates one canonical
        ledger credit. A retry returns the existing award and current balance,
        including after the streak capability is disabled. These rewards do not
        consume the walking/check-in daily cap.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreakCollectionRequest'}
      responses:
        '201':
          description: New streak award; created is true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreakCollection'}
        '200':
          description: Existing award; created is false
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreakCollection'}
        '400':
          description: INVALID_STREAK_REQUEST or INVALID_STREAK_MILESTONE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: STREAK_NOT_READY, QUEST_DISABLED or QUALIFICATION_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/quests/documents:
    get:
      summary: Read the OWNER's dogs, document submissions and reward eligibility
      description: >-
        Submissions are newest first and include historical dog identity
        snapshots. Entitlements distinguish READY reservations from COLLECTED
        rewards; can_collect also checks current dog ownership and quest
        availability. Existing submissions remain readable when the document
        quest is disabled. File contents require a separate authenticated download.
      responses:
        '200':
          description: Owned documents and per-dog eligibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentDashboard'}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Submit evidence and reserve an eligible document reward for explicit collection
      description: >-
        OWNER only; evidence is self-reported and may be audited later. A new
        submission awards zero points and leaves its entitlement READY until
        the owner explicitly collects it. Rewards belong to the dog: council
        and microchip registrations each reserve 300 points once in the dog's
        lifetime; vet check-ups reserve 200 points per visit, at most
        twice in the visit's calendar year and at least 60 days apart even across
        New Year. Dates use Australia/Melbourne. Pending reservations consume
        the same quota as collected rewards. Updated evidence for an existing
        entitlement adds no reward; an already credited entitlement stays
        COLLECTED. Legacy microchip annual entitlements and credits are preserved;
        any prior credited microchip entitlement prevents another credit.
        Otherwise only the oldest pending microchip reservation is collectible;
        a held or rejected reservation cannot be bypassed by a newer one.
        Re-uploading registration proof never creates an additional reward.
        The same vet photo cannot support another visit for the same owner and dog.
        Send request_id and reuse the exact request on an ambiguous failure.
        An identical owner/UUID retry replays the stored receipt, including its
        original balance and created=true, with HTTP200. Legacy stored receipts
        may contain the previous immediate award and omit the newer entitlement
        fields; their exact JSON is preserved and they never trigger another
        credit. Do not add awarded_points to a local wallet again. Reusing the UUID for
        different evidence returns 409. Disabled quests reject new submissions
        with 409 but permit identical retries of existing submissions.
        The JSON body is limited to 6 MiB and each decoded file to 4 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentRequest'}
      responses:
        '201':
          description: New submission; awarded_points is zero, with READY or previously COLLECTED entitlement metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentReceipt'}
        '200':
          description: Original stored receipt for an identical retry, including its original balance and created value
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentReceipt'}
        '400':
          description: Invalid dog, dates, proof, reward frequency or reused evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentValidationError'}
        '409':
          description: Request UUID conflict or document quest currently disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/quests/documents/entitlements/{entitlement_id}/collect:
    parameters:
      - name: entitlement_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    post:
      summary: Collect a reserved document reward exactly once (OWNER only)
      description: >-
        The current owner must still own the dog and have submitted evidence
        for this entitlement. After an ownership transfer, the new owner must
        submit their own evidence before collecting an unclaimed entitlement.
        Collection atomically links one wallet credit to the entitlement; no
        request UUID is required. Simultaneous collection from Quest and document
        views, and retries after a lost response, return the same credited
        entitlement without another award. Only the original credit recipient
        can replay an already collected reward, including after dog deletion,
        transfer or quest disable. Other accounts receive 404 and cannot read
        the recipient's balance. Legacy immediate awards stay collected, with
        their collection timestamp backfilled from the original ledger entry;
        migration never credits points again. Document bonuses do not consume
        the walking/check-in daily cap.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, description: Empty object; entitlement determines the reward}
      responses:
        '200':
          description: Canonical reward and current wallet balance; created is true only on the first collection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentCollectionReceipt'}
        '400':
          description: Reward is held or rejected, or this legacy microchip reservation is superseded by the dog's lifetime entitlement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentValidationError'}
        '404':
          description: Entitlement not visible, no owned dog or evidence for a pending reward, or an already collected reward belongs to another recipient
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Document quest disabled for a new collection; successful collection retries remain available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/quests/documents/{submission_id}/file:
    parameters:
      - name: submission_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      summary: Download an authenticated document file
      description: >-
        The submitting owner can read their file; ADMIN and superuser accounts
        can read files for later audits. Other accounts and submissions without
        an attachment return 404. Files are privately stored and are not public
        media URLs. JWT or an authenticated Django session is required.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Original evidence as a download with a sanitized display filename
          headers:
            Content-Disposition: {schema: {type: string}, description: Attachment with the saved display filename}
            Cache-Control: {schema: {type: string, enum: ['private, no-store']}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string, enum: ["sandbox; default-src 'none'"]}}
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '404': {description: 'Submission not visible to this account, no attachment or missing stored file'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    sessionCookie: {type: apiKey, in: cookie, name: sessionid, description: Django session accepted only for protected document downloads}
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    Error:
      description: >-
        Validation/business error, unauthenticated (401), wrong role (403), or
        resource not found (404). DRF uses detail/field errors; business failures
        use code/message. Always inspect the HTTP status.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    PhotoUpload:
      type: object
      required: [image_base64]
      properties:
        image_base64: {type: string, format: byte, maxLength: 5592408, description: Raw base64 without a data-URL prefix}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, writeOnly: true}
    User:
      type: object
      required: [id, email, display_name, role, photo]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {type: string, enum: [OWNER, CAFE, ADMIN]}
        photo: {type: string, format: uri, nullable: true}
    AuthSession:
      type: object
      required: [access, refresh, user]
      properties:
        access: {type: string}
        refresh: {type: string}
        user: {$ref: '#/components/schemas/User'}
    DogSize: {type: string, enum: [SMALL, MEDIUM, LARGE]}
    Breed:
      type: object
      required: [id, name, energy_level, default_size, is_brachycephalic]
      properties:
        id: {type: integer}
        name: {type: string}
        energy_level: {type: string, enum: [LOW, MODERATE, HIGH]}
        default_size: {$ref: '#/components/schemas/DogSize'}
        is_brachycephalic: {type: boolean}
    DogInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        photo: {type: string, nullable: true, description: Legacy external URL or blank/null. A separately uploaded avatar takes precedence in responses}
        breed_id: {type: integer, minimum: 1}
        age_months: {type: integer, minimum: 0, description: Legacy age when DOB is unknown; computed from DOB whenever a birthday is present}
        date_of_birth: {type: string, format: date, nullable: true, description: Optional real birthday no later than the current server-local date; null means unknown}
        size: {$ref: '#/components/schemas/DogSize'}
        is_brachycephalic: {type: boolean, description: Defaults from breed when omitted on creation}
    Dog:
      type: object
      required: [id, name, photo, breed, age_months, date_of_birth, size, is_brachycephalic, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        photo: {type: string, nullable: true}
        breed: {$ref: '#/components/schemas/Breed'}
        age_months: {type: integer, minimum: 0, description: 'Completed calendar months from date_of_birth, or saved legacy age if DOB is null'}
        date_of_birth: {type: string, format: date, nullable: true}
        size: {$ref: '#/components/schemas/DogSize'}
        is_brachycephalic: {type: boolean}
        created_at: {type: string, format: date-time}
    QuestTask:
      type: object
      required: [id, kind, status, title, subtitle, subject_name, photo, icon, detail, reward_points, progress, dog_id, entitlement_id, collected_at]
      description: >-
        A currently actionable task or the owner's receipt collected today.
        IN_PROGRESS document rows open submission; READY birthday rows use
        dog_id to collect, and READY document rows use entitlement_id. COLLECTED
        rows cannot be claimed again and remain only for their Melbourne
        collection date. Unknown kinds or states must not enable an action.
        STREAK has no dog or document entitlement; its current_days,
        milestone_days and run_start_date identify the single progress bar.
        Clamp its displayed numerator to the milestone while READY. Idle state
        is zero of seven with a null run start. DAILY_GOAL remains reserved and omitted.
      properties:
        id: {type: string, description: 'Stable row identity; birthday dog/year, document dog/kind or entitlement ID, streak run/milestone, or streak:idle:7'}
        kind: {type: string, enum: [BIRTHDAY, COUNCIL_REGISTRATION, MICROCHIP_REGISTRATION, VET_CHECKUP, DAILY_GOAL, STREAK]}
        status: {type: string, enum: [IN_PROGRESS, READY, COLLECTED]}
        title: {type: string}
        subtitle: {type: string}
        subject_name: {type: string, description: Dog name or account-level task subject; preserved dog name snapshot for historical ownership}
        photo: {type: string, nullable: true}
        icon: {type: string, description: Suggested SF Symbol name}
        detail: {type: string, description: Qualification and collection explanation}
        reward_points: {type: integer, minimum: 0, description: Collectible amount or the actual collected award; not a wallet balance}
        progress: {type: number, minimum: 0, maximum: 1, nullable: true, description: Null when numeric progress is not defined; do not display as zero percent}
        dog_id: {type: integer, minimum: 1, nullable: true, description: Dog identity or immutable ID snapshot}
        entitlement_id: {type: integer, minimum: 1, nullable: true, description: Reserved document reward ID; null for non-document and unsubmitted document tasks}
        collected_at: {type: string, format: date-time, nullable: true, description: Actual award time; null before collection}
        current_days: {type: integer, minimum: 0, description: STREAK only; verified consecutive days in the represented run}
        milestone_days: {type: integer, minimum: 7, description: STREAK only; seven or a positive multiple of thirty}
        run_start_date: {type: string, format: date, nullable: true, description: STREAK only; null when no run or earned milestone is available}
    QuestDashboard:
      type: object
      required: [server_time, timezone, local_date, next_reset_at, tasks]
      properties:
        server_time: {type: string, format: date-time}
        timezone: {type: string, enum: [Australia/Melbourne]}
        local_date: {type: string, format: date}
        next_reset_at: {type: string, format: date-time, description: Next Melbourne midnight; not a fixed 24-hour offset}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/QuestTask'}
          description: >-
            Available rows ordered READY, IN_PROGRESS, then COLLECTED, with
            deterministic kind/dog/ID ordering within each state. Empty is valid.
            Collected rows are retained only on the same Melbourne calendar day;
            removing a row never removes its ledger or document history.
    BirthdayAward:
      type: object
      required: [id, kind, dog_id, year, points, awarded_at]
      properties:
        id: {type: integer, minimum: 1}
        kind: {type: string, enum: [BIRTHDAY]}
        dog_id: {type: integer, minimum: 1, description: 'Immutable dog ID snapshot, including after deletion'}
        year: {type: integer, description: Award calendar year in Australia/Melbourne}
        points: {type: integer, enum: [60]}
        awarded_at: {type: string, format: date-time}
    BirthdayCollection:
      type: object
      required: [award, balance, created]
      properties:
        award: {$ref: '#/components/schemas/BirthdayAward'}
        balance: {type: integer, minimum: 0, description: 'Current authoritative wallet balance, including on replay'}
        created: {type: boolean, description: True only when this request created the award; false on replay}
    StreakCollectionRequest:
      type: object
      required: [run_start_date, milestone_days]
      properties:
        run_start_date: {type: string, format: date}
        milestone_days: {type: integer, minimum: 7, description: Seven or a positive multiple of thirty}
    StreakAward:
      type: object
      required: [id, kind, run_start_date, milestone_days, points, awarded_at]
      properties:
        id: {type: integer, minimum: 1}
        kind: {type: string, enum: [STREAK]}
        run_start_date: {type: string, format: date}
        milestone_days: {type: integer, minimum: 7}
        points: {type: integer, enum: [20, 100]}
        awarded_at: {type: string, format: date-time}
    StreakCollection:
      type: object
      required: [award, balance, created]
      properties:
        award: {$ref: '#/components/schemas/StreakAward'}
        balance: {type: integer, minimum: 0, description: Current authoritative wallet balance}
        created: {type: boolean}
    DocumentKind:
      type: string
      enum: [COUNCIL_REGISTRATION, MICROCHIP_REGISTRATION, VET_CHECKUP]
    DocumentRewardStatus:
      type: string
      enum: [READY, COLLECTED]
      description: READY reserves eligibility without wallet credit; COLLECTED is already linked to one canonical ledger credit
    DocumentDog:
      type: object
      required: [id, name, photo]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        photo: {type: string, nullable: true}
    DocumentEligibility:
      type: object
      required: [dog_id, kind, awards_count, pending_count, remaining_this_year, can_earn, message]
      properties:
        dog_id: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/DocumentKind'}
        awards_count: {type: integer, minimum: 0, description: Number of this dog's rewarded entitlements for this kind across all years and owners}
        pending_count: {type: integer, minimum: 0, description: Uncredited reservations counting toward quota; registrations count only the canonical lifetime reservation}
        remaining_this_year: {type: integer, minimum: 0, maximum: 2, nullable: true, description: Vet slots remaining in the current Melbourne calendar year after pending and collected reservations; null for registrations}
        can_earn: {type: boolean, nullable: true, description: Whether the registration lifetime reward remains unreserved; null for vet check-ups requiring an event date}
        message: {type: string}
    DocumentSubmission:
      type: object
      required: [id, request_id, dog_id, dog_name, kind, status, registration_number, event_date, valid_from, valid_to, filename, file_url, awarded_points, submitted_at]
      description: >-
        Immutable submission version. Current responses include entitlement_id,
        reward_status, reward_points and collected_at. These additive fields
        remain optional in this schema because exact replays of stored legacy
        receipts may omit them. The submission's awarded_points records what
        happened at upload time and is not changed by later collection.
      properties:
        id: {type: integer, minimum: 1}
        request_id: {type: string, format: uuid}
        dog_id: {type: integer, minimum: 1, description: Original dog identity retained after deletion or transfer}
        dog_name: {type: string, description: Submission-time name snapshot}
        kind: {$ref: '#/components/schemas/DocumentKind'}
        status: {type: string, enum: [SELF_REPORTED], description: Self-reported evidence; later audit possible and no prior approval implied}
        registration_number: {type: string, maxLength: 100}
        council_name: {type: string, maxLength: 100, description: Self-reported issuing council; empty for uploads and legacy records}
        registration_year: {type: integer, nullable: true, description: 'Council registration ending year: 2027 represents 10 April 2026 through 9 April 2027; null for uploads and legacy records'}
        event_date: {type: string, format: date, nullable: true}
        valid_from: {type: string, format: date, nullable: true}
        valid_to: {type: string, format: date, nullable: true}
        filename: {type: string, maxLength: 150, description: Sanitized display filename or empty when no file was submitted}
        file_url: {type: string, nullable: true, description: 'Relative authenticated download path, not a public media URL'}
        awarded_points: {type: integer, enum: [0, 200, 300], description: Always zero for new submissions; legacy immediately credited submissions retain their original amount}
        submitted_at: {type: string, format: date-time}
        entitlement_id: {type: integer, minimum: 1}
        reward_status: {$ref: '#/components/schemas/DocumentRewardStatus'}
        reward_points: {type: integer, enum: [200, 300]}
        collected_at: {type: string, format: date-time, nullable: true}
    DocumentEntitlement:
      type: object
      required: [id, dog_id, dog_name, kind, reward_status, reward_points, collected_at, can_collect]
      properties:
        id: {type: integer, minimum: 1}
        dog_id: {type: integer, minimum: 1, description: Immutable dog ID retained after deletion}
        dog_name: {type: string, description: Current owned dog name or this viewer's historical submission snapshot}
        kind: {$ref: '#/components/schemas/DocumentKind'}
        reward_status: {$ref: '#/components/schemas/DocumentRewardStatus'}
        reward_points: {type: integer, enum: [200, 300]}
        collected_at: {type: string, format: date-time, nullable: true, description: Null for READY; legacy awards use their original ledger timestamp}
        can_collect: {type: boolean, description: Current owner has evidence for this eligible uncredited entitlement and the quest is enabled; superseded legacy microchip reservations are false even when their historical status remains READY}
    DocumentDashboard:
      type: object
      required: [dogs, submissions, eligibility, entitlements]
      properties:
        dogs: {type: array, items: {$ref: '#/components/schemas/DocumentDog'}}
        submissions: {type: array, items: {$ref: '#/components/schemas/DocumentSubmission'}}
        eligibility: {type: array, items: {$ref: '#/components/schemas/DocumentEligibility'}}
        entitlements: {type: array, items: {$ref: '#/components/schemas/DocumentEntitlement'}}
    DocumentRequest:
      type: object
      required: [request_id, dog_id, kind]
      description: >-
        Council and microchip registrations accept exactly one route: entered
        details OR a PDF/JPEG/PNG proof file. Council entered details require
        council_name, registration_number and registration_year matching the
        current Victorian registration year (10 April through 9 April).
        registration_year stores the ending year. Council numbers preserve
        leading zeros and may contain letters, digits, spaces and hyphens;
        there is no universal council number length. Microchip entered numbers
        normalize spaces/hyphens to exactly 15 ASCII digits without a required
        prefix; other formats use the proof route. Neither registration kind
        accepts new event/validity dates. Uploads need no entered number,
        council or year. A number or file remains self-reported, not verified.
        Registration PDFs must be unencrypted with 1–20 pages; photos must
        decode as JPEG/PNG with at most 16 megapixels.
        Vet requires event_date no later than today and no earlier than a known
        DOB, plus a JPEG/PNG photo of at most 16 megapixels; it rejects registration
        numbers and validity dates. All dates use YYYY-MM-DD and eligibility uses
        the Melbourne calendar. Files are raw base64,
        not data URLs, and are limited to 4 MiB decoded. The display filename never
        determines the storage path or trusted file type.
      properties:
        request_id: {type: string, format: uuid}
        dog_id: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/DocumentKind'}
        registration_number: {type: string, maxLength: 100, description: 'Entered-details route only; council animal/registration reference or 15-digit microchip number, preserved as text'}
        council_name: {type: string, maxLength: 100, description: Required only for entered Council details}
        registration_year: {type: integer, description: 'Required only for entered Council details; ending year, for example 2027 for 2026–27'}
        event_date: {type: string, format: date, nullable: true}
        valid_from: {type: string, format: date, nullable: true, deprecated: true, description: Historical retry compatibility only; do not send for new submissions}
        valid_to: {type: string, format: date, nullable: true, deprecated: true, description: Historical retry compatibility only; do not send for new submissions}
        filename: {type: string, maxLength: 150}
        file_base64: {type: string, format: byte, maxLength: 5592408}
    DocumentValidationError:
      oneOf:
        - $ref: '#/components/schemas/Error'
        - type: array
          items: {type: string}
      description: DRF field/detail object or a list of general validation messages
    DocumentReceipt:
      type: object
      required: [submission, balance, awarded_points, created]
      description: >-
        A submission receipt, not a collection receipt. New submissions reserve
        READY rewards with awarded_points=0, or attach to an already COLLECTED
        entitlement. Exact legacy retries may still contain their original
        immediate award and omit the additive entitlement fields. A replay never
        creates another credit; use GET documents to refresh current reward state.
      properties:
        submission: {$ref: '#/components/schemas/DocumentSubmission'}
        balance: {type: integer, minimum: 0, description: Wallet balance captured when the submission was created; identical retries replay this value}
        awarded_points: {type: integer, enum: [0, 200, 300], description: Zero for a new submission; legacy award amount is preserved only for its original receipt}
        created: {type: boolean, enum: [true], description: 'Original stored receipt value; remains true on HTTP200 replay, so use status/idempotency rather than this field to detect a new award'}
        entitlement_id: {type: integer, minimum: 1}
        reward_status: {$ref: '#/components/schemas/DocumentRewardStatus'}
        reward_points: {type: integer, enum: [200, 300]}
        collected_at: {type: string, format: date-time, nullable: true}
    DocumentCollectionReceipt:
      type: object
      required: [entitlement_id, kind, dog_id, points, balance, collected_at, created]
      properties:
        entitlement_id: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/DocumentKind'}
        dog_id: {type: integer, minimum: 1, description: Immutable dog identity snapshot}
        points: {type: integer, enum: [200, 300], description: Canonical original credit amount; retries do not award it again}
        balance: {type: integer, minimum: 0, description: 'Current authoritative wallet balance, including on replay'}
        collected_at: {type: string, format: date-time, description: 'Original collection time, unchanged on retry'}
        created: {type: boolean, description: True only when this call credited the reserved reward; false on replay}
    WalkSample:
      type: object
      required: [latitude, longitude, recorded_at, accuracy_m]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        recorded_at: {type: string, format: date-time}
        accuracy_m: {type: number, minimum: 0}
        is_simulated: {type: boolean, default: false}
        segment_id:
          type: integer
          minimum: 0
          maximum: 4999
          default: 0
          description: Consecutive route segment index starting at zero. Pauses, GPS interruptions and recovered sessions start new segments; distance is never credited across a boundary. The five-minute inactivity rule still applies across boundaries. Omitted for legacy clients (one segment).
    Walk:
      type: object
      required: [id, request_id, started_at, ended_at, distance_m, points_awarded, point_date, dog_ids]
      properties:
        id: {type: integer}
        request_id: {type: string, format: uuid}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        distance_m: {type: number, minimum: 0}
        points_awarded: {type: integer, minimum: 0, maximum: 40}
        point_date: {type: string, format: date}
        dog_ids: {type: array, items: {type: integer}}
    PointEntry:
      type: object
      required: [id, amount, type, expires_at, created_at]
      properties:
        id: {type: integer}
        amount: {type: integer, description: Positive credit or negative debit; never zero}
        type: {type: string, enum: [EARN, SPEND, REFUND, EXPIRE, ADMIN]}
        expires_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    Reward:
      type: object
      required: [id, name, description, point_cost, cafe_name, venue_id, photo, starts_at, ends_at, daily_quantity_limit, terms, requires_store_purchase]
      description: Available menu item belonging to a normalized Venue; legacy café fields remain for existing clients.
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        point_cost: {type: integer, minimum: 1}
        cafe_name: {type: string, description: Current Venue name}
        cafe_id: {type: integer, description: 'Legacy managing café User ID, not Venue ID'}
        venue_id: {type: integer, minimum: 1, description: Canonical Venue ID}
        photo: {type: string, format: uri, nullable: true, readOnly: true, description: Product photo; separate from venue and user photos}
        starts_at: {type: string, format: date-time, nullable: true, description: Inclusive sale start; null means no lower bound}
        ends_at: {type: string, format: date-time, nullable: true, description: Exclusive sale end; null means no upper bound}
        daily_quantity_limit: {type: integer, minimum: 1, nullable: true, description: 'Allocation per Melbourne order date; null is unlimited. Pending unexpired and collected orders count; cancelled/expired orders release allocation'}
        terms: {type: string}
        requires_store_purchase: {type: boolean, description: 'Offer condition only; no fiat payment or in-store purchase verification is performed by this API'}
        cafe_photo: {type: string, format: uri, nullable: true, description: Current Venue photo; separate from the login account avatar}
        cafe_address: {type: string}
        cafe_description: {type: string}
        cafe_opening_hours: {type: string}
        cafe_google_maps_url: {type: string, format: uri}
    CafeProductInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Trimmed; whitespace-only names are invalid}
        description: {type: string, maxLength: 2000, default: ''}
        point_cost: {type: integer, minimum: 1, maximum: 2147483647}
        is_available: {type: boolean, default: true}
        starts_at: {type: string, format: date-time, nullable: true, description: Inclusive sale start; omitted on create defaults to null}
        ends_at: {type: string, format: date-time, nullable: true, description: Exclusive sale end; must follow starts_at when both are set}
        daily_quantity_limit: {type: integer, minimum: 1, maximum: 2147483647, nullable: true, description: Per-product Melbourne-day allocation; null means unlimited}
        terms: {type: string, maxLength: 2000, default: ''}
        requires_store_purchase: {type: boolean, default: false, description: Descriptive offer condition; does not verify a cash purchase}
    CafeProduct:
      type: object
      required: [id, venue_id, name, description, point_cost, is_available, photo, starts_at, ends_at, daily_quantity_limit, terms, requires_store_purchase, updated_at]
      properties:
        id: {type: integer, readOnly: true}
        venue_id: {type: integer, minimum: 1, readOnly: true, description: Managed Venue assigned from the authenticated café account}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        point_cost: {type: integer, minimum: 1, maximum: 2147483647}
        is_available: {type: boolean}
        photo: {type: string, format: uri, nullable: true, readOnly: true}
        starts_at: {type: string, format: date-time, nullable: true}
        ends_at: {type: string, format: date-time, nullable: true}
        daily_quantity_limit: {type: integer, minimum: 1, nullable: true}
        terms: {type: string}
        requires_store_purchase: {type: boolean}
        updated_at: {type: string, format: date-time, readOnly: true}
    Redemption:
      type: object
      required: [id, reference_number, reward, reward_name_snapshot, point_cost_snapshot, status, created_at, collected_at, expires_at, cafe_name_snapshot, venue_id, terms_snapshot, order_date]
      properties:
        id: {type: integer}
        reference_number: {type: string}
        reward: {type: integer, description: Catalogue reward ID; historic names/prices use snapshots}
        reward_name_snapshot: {type: string}
        point_cost_snapshot: {type: integer, minimum: 1}
        cafe_name_snapshot: {type: string, description: Venue name at order time}
        cafe_id: {type: integer, description: 'Café User ID responsible at order time; retained even if venue management changes'}
        venue_id: {type: integer, minimum: 1, description: Canonical Venue recorded on this order}
        terms_snapshot: {type: string, description: Offer terms at order time; later product edits do not change it}
        order_date: {type: string, format: date, description: Immutable Melbourne purchase date used for daily allocation}
        cafe_photo: {type: string, format: uri, nullable: true, description: Current Venue photo}
        cafe_address: {type: string}
        cafe_description: {type: string}
        cafe_opening_hours: {type: string}
        cafe_google_maps_url: {type: string, format: uri}
        status: {type: string, enum: [PENDING, COLLECTED, EXPIRED, CANCELLED]}
        created_at: {type: string, format: date-time}
        collected_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, description: Next Melbourne midnight}
    CafeProfile:
      type: object
      required: [venue_id, name, email, address, description, opening_hours, photo, google_maps_url, maps_link]
      properties:
        venue_id: {type: integer, minimum: 1, readOnly: true, description: Canonical managed Venue identity; not the login account ID}
        name: {type: string, maxLength: 100, description: Venue name; changing it does not change User.display_name}
        email: {type: string, format: email, readOnly: true, description: Managing café account's login email}
        address: {type: string, maxLength: 255}
        description: {type: string, maxLength: 2000}
        opening_hours: {type: string, maxLength: 500}
        photo: {type: string, format: uri, nullable: true, readOnly: true, description: Venue photo; separate from the account avatar}
        google_maps_url: {type: string, maxLength: 2048, description: Stored Google Maps link or blank when using address search}
        maps_link: {type: string, format: uri, readOnly: true, description: Saved link or automatic name/address search}
    CafeOrder:
      type: object
      required: [id, reference_number, owner_name, owner_dog_names, owner_dogs, items, ordered_at, status, expires_at]
      properties:
        id: {type: integer}
        reference_number: {type: string}
        owner_name: {type: string, description: Order-time customer name snapshot}
        owner_dogs:
          type: array
          description: Current profile dogs belonging to this order's customer; upload photos take precedence over legacy external URLs. Only id, name and photo are exposed.
          items:
            type: object
            required: [id, name, photo]
            properties:
              id: {type: integer}
              name: {type: string}
              photo: {type: string, nullable: true, description: Absolute uploaded-photo URL or legacy external URL; null or blank when unset}
        owner_dog_names:
          type: array
          items: {type: string}
          description: Current profile dog names belonging to this order's customer; not an order-time snapshot or walk association
        status: {type: string, enum: [PENDING], description: This feed only returns orders awaiting collection}
        expires_at: {type: string, format: date-time}
        ordered_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [name, quantity]
            properties:
              name: {type: string}
              quantity: {type: integer, enum: [1]}
    Error:
      type: object
      additionalProperties: true
      properties:
        detail: {type: string}
        code: {type: string}
        message: {type: string}
