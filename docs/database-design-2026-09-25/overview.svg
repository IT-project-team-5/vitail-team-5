<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1110" viewBox="0 0 1360 1110" role="img" aria-labelledby="title desc">
<title id="title">Vitail current database foundation</title><desc id="desc">23 current domain model tables in six groups. Six deferred tables are not created. Operational features and dormant foundations are distinguished; exact foreign keys are in schema.mmd.</desc>
