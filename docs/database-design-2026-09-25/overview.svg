<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" role="img" aria-labelledby="title desc">
<title id="title">Vitail database design overview</title><desc id="desc">28 domain tables in six groups. 22 core tables and six deferred tables. Exact foreign keys are in schema.mmd and schema.dbml. Proposed design, not deployed.</desc>
<rect width="100%" height="100%" fill="#f6f5f1"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="56" y="53" font-size="14" fill="#64726b" letter-spacing="2">VITAIL / DATA DESIGN</text>
<text x="56" y="105" font-size="36" fill="#263833" font-weight="700">Complete coverage. Small, explicit models.</text>
<text x="56" y="141" font-size="18" fill="#64726b" >22 core tables + 6 deferred  /  37 Jira items reviewed  /  25 September 2026</text>
<rect x="56" y="186" width="390" height="342" rx="16" fill="white" stroke="#d9ddd5"/>
<rect x="56" y="186" width="390" height="8" rx="4" fill="#256b68"/>
