<text x="508" y="254" font-size="24" fill="#263833" font-weight="700">Places &amp; points</text>
<text x="508" y="290" font-size="17" fill="#263833" >Venue</text>
<text x="508" y="317" font-size="17" fill="#263833" >Reward</text>
<text x="508" y="344" font-size="17" fill="#263833" >Redemption</text>
