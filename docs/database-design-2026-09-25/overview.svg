<text x="938" y="656" font-size="17" fill="#263833" >UserBlock</text>
<text x="938" y="794" font-size="12" fill="#6f786f" >Locked services; no social API or matching.</text>
<text x="56" y="876" font-size="12" fill="#64726b" letter-spacing="1.7" font-weight="700">NOT CREATED</text>
<text x="56" y="910" font-size="19" fill="#263833" >ExternalIdentity  ·  ChatMessage  ·  Charity  ·  Donation  ·  PushDevice  ·  NotificationDelivery</text>
<text x="56" y="963" font-size="18" fill="#263833" >No peer-location/social APIs, live matching, daily-goal payout, or net-walk awards are enabled.</text>
<text x="56" y="998" font-size="18" fill="#263833" >Check-in location flow is connected; physical-device and background acceptance remain pending.</text>
<text x="56" y="1059" font-size="14" fill="#69786f" >Model metadata, not deployment status · Django infrastructure excluded · Exact fields / keys: schema.dbml / schema.mmd</text>
