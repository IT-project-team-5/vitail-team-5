<text x="56" y="105" font-size="36" fill="#263833" font-weight="700">23 tables. Clear feature boundaries.</text>
<text x="56" y="141" font-size="18" fill="#64726b" >37 Jira items traced  /  6 deferred tables NOT created  /  25 September 2026</text>
