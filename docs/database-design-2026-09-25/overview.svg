<text x="78" y="254" font-size="24" fill="#263833" font-weight="700">People &amp; dogs</text>
<text x="78" y="290" font-size="17" fill="#263833" >User</text>
<text x="78" y="317" font-size="17" fill="#263833" >Breed</text>
<text x="78" y="344" font-size="17" fill="#263833" >Dog</text>
<text x="78" y="371" font-size="17" fill="#263833" >ExternalIdentity</text>
<text x="424" y="371" font-size="10" fill="#777" text-anchor="end" letter-spacing="1">LATER</text>
<text x="78" y="506" font-size="13" fill="#6f786f" >Photos / birthday / microchip / consent</text>
<rect x="486" y="186" width="390" height="342" rx="16" fill="white" stroke="#d9ddd5"/>
<rect x="486" y="186" width="390" height="8" rx="4" fill="#956122"/>
