<text x="508" y="888" font-size="13" fill="#6f786f" >Leaderboard is a query, not a table.</text>
<rect x="916" y="568" width="390" height="342" rx="16" fill="white" stroke="#d9ddd5"/>
<rect x="916" y="568" width="390" height="8" rx="4" fill="#74747c"/>
<text x="938" y="604" font-size="12" fill="#74747c" letter-spacing="1.7" font-weight="700">LATER</text>
<text x="938" y="636" font-size="24" fill="#263833" font-weight="700">Donations &amp; notifications</text>
<text x="938" y="672" font-size="17" fill="#263833" >Charity</text>
<text x="1284" y="672" font-size="10" fill="#777" text-anchor="end" letter-spacing="1">LATER</text>
<text x="938" y="699" font-size="17" fill="#263833" >Donation</text>
<text x="1284" y="699" font-size="10" fill="#777" text-anchor="end" letter-spacing="1">LATER</text>
<text x="938" y="726" font-size="17" fill="#263833" >PushDevice</text>
<text x="1284" y="726" font-size="10" fill="#777" text-anchor="end" letter-spacing="1">LATER</text>
<text x="938" y="753" font-size="17" fill="#263833" >NotificationDelivery</text>
<text x="1284" y="753" font-size="10" fill="#777" text-anchor="end" letter-spacing="1">LATER</text>
<text x="938" y="888" font-size="13" fill="#6f786f" >Add with their feature. No payments.</text>
<text x="56" y="967" font-size="16" fill="#263833" font-weight="700">Key relationships</text>
<text x="56" y="997" font-size="16" fill="#263833" >User → Dog / Walk / Friendship     Venue → Reward → Redemption     Qualification → PointEntry</text>
<text x="56" y="1038" font-size="14" fill="#69786f" >Overview only · Exact FK cardinalities and constraints: schema.mmd / schema.dbml · Design proposal, not a migration</text>
