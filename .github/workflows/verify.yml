name: Verify Vitail

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vitail-ci
          MYSQL_DATABASE: vitail
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pvitail-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_ENGINE: mysql
      MYSQL_DATABASE: vitail
      MYSQL_USER: root
      MYSQL_PASSWORD: vitail-ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install -r backend/requirements.txt
      - name: Check schema and run tests including database locks
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test-results/backend
          git rev-parse HEAD > ../test-results/backend/source-sha.txt
          python --version > ../test-results/backend/runtime.txt
          python manage.py check 2>&1 | tee ../test-results/backend/check.log
          python manage.py makemigrations --check --dry-run 2>&1 | tee ../test-results/backend/migration-drift.log
          python manage.py test --verbosity 2 2>&1 | tee ../test-results/backend/tests.log
      - name: Save backend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend
          if-no-files-found: warn
          retention-days: 30

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [device for runtime, values in devices.items() if 'iOS' in runtime
                    for device in values if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_DEVICE=' + phones[0]['udid'] + '\n')
          PY
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/ios
          git rev-parse HEAD > test-results/ios/source-sha.txt
          xcodebuild -version > test-results/ios/xcode-version.txt
          xcodebuild test -project ios/Vitail.xcodeproj -scheme Vitail \
            -destination "platform=iOS Simulator,id=$TEST_DEVICE" \
            -enableCodeCoverage YES -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-results/ios/xcodebuild.log
      - name: Export test and coverage JSON
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/ios
          export_json() {
            local target="$1"
            shift
            if "$@" > "$target.tmp" 2> "$target.stderr.log"; then
              mv "$target.tmp" "$target"
            else
              rm -f "$target.tmp"
              echo "::warning::Could not export $target; see retained export log and result bundle."
            fi
          }
          if [ -d TestResults.xcresult ]; then
            export_json test-results/ios/summary.json xcrun xcresulttool get test-results summary --path TestResults.xcresult
            export_json test-results/ios/cases.json xcrun xcresulttool get test-results tests --path TestResults.xcresult
            export_json test-results/ios/coverage.json xcrun xccov view --report --json TestResults.xcresult
          else
            echo "::warning::No Xcode result bundle was created; see build log."
          fi
      - name: Save Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            test-results/ios
          if-no-files-found: warn
          retention-days: 30
