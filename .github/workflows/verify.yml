name: Verify Vitail

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vitail-ci
          MYSQL_DATABASE: vitail
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pvitail-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_ENGINE: mysql
      MYSQL_DATABASE: vitail
      MYSQL_USER: root
      MYSQL_PASSWORD: vitail-ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install -r backend/requirements.txt
      - name: Check schema and run tests including database locks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity 1

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [device for runtime, values in devices.items() if 'iOS' in runtime
                    for device in values if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_DEVICE=' + phones[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: >-
          xcodebuild test -project ios/Vitail.xcodeproj -scheme Vitail
          -destination "platform=iOS Simulator,id=$TEST_DEVICE"
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Save Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
